<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wick Duel</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 520px; margin: 0 auto; padding: 52px 22px; line-height: 1.55; color: #1c1c1e; text-align: center; }
    h1 { font-size: 1.5rem; margin: 8px 0 6px; }
    p { color: #4a4a4f; margin: 0 0 22px; }
    .flame { font-size: 3rem; }
    .code { font-family: ui-monospace, Menlo, monospace; font-weight: 800; font-size: 1.4rem; letter-spacing: 1px; color: #d8552f; background: #fff4ef; border: 1px solid #f0d9cf; border-radius: 12px; padding: 10px 16px; display: inline-block; margin: 4px 0 28px; }
    .btn { display: block; text-decoration: none; font-weight: 600; padding: 15px 20px; border-radius: 13px; margin: 0 auto; max-width: 340px; background: #d8552f; color: #fff; }
    .btn:hover { background: #c2491f; }
    .muted { color: #8a8a90; font-size: 0.85rem; margin-top: 26px; }
    .muted b { color: #6b6b70; }
  </style>
</head>
<body>
  <div class="flame">🔥</div>
  <h1>You've been challenged to a Wick duel</h1>
  <p>Guess the secret word by meaning — can you beat your friend?</p>

  <div class="code" id="code">…</div>

  <a class="btn" href="https://apps.apple.com/app/id6777743483">Get Wick — free on the App Store</a>

  <p class="muted">Already have Wick? This link opens the duel automatically.<br>
  New here? Get the app, then open it → <b>Duel</b> → <b>Paste</b> to enter the code above.</p>

  <script>
    (function () {
      var code = (new URLSearchParams(window.location.search).get('c') || '').trim().toUpperCase();
      var el = document.getElementById('code');
      if (code) { el.textContent = code; } else { el.style.display = 'none'; }
    })();
  </script>
</body>
</html>
