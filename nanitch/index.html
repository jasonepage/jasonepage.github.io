<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nanitch has moved to nanitch.com</title>
<link rel="canonical" href="https://nanitch.com/">
<meta http-equiv="refresh" content="0; url=https://nanitch.com/">
<meta name="description" content="Nanitch now lives at nanitch.com — a moderated map of hot springs, saunas, cold plunges and clothing-optional spots.">
<!--
  This page used to be a full copy of the Nanitch site: same title, same description,
  same copy as nanitch.com. Two identical sites is a duplicate-content problem, and
  this one sits on a domain Google already crawls heavily — so it was the copy at risk
  of being treated as the original.

  GitHub Pages cannot serve a 301, so this is the next best thing: an instant meta
  refresh plus a canonical, which Google treats as a soft redirect and consolidates.
  The visible link below is for anyone who arrives with JavaScript or refresh disabled.

  The sibling pages here — privacy.html, support.html, terms.html, guidelines.html —
  are deliberately NOT redirected. The live App Store listing still points its Privacy
  Policy URL at this folder, and Apple requires that to resolve to a real policy. Those
  pages keep working and carry a canonical instead. When the listing's URLs move to
  nanitch.com with the next release, they can be redirected here too.
-->
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:#f8f4ec;color:#22302b;line-height:1.6;text-align:center;padding:24px;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:480px}
h1{font-size:26px;color:#2f4a3d;margin:0 0 10px}
p{font-size:19px;color:#6c7a72;margin:0 0 22px}
a.cta{display:inline-block;background:#e8a13a;color:#2a2000;font-weight:800;
padding:15px 26px;border-radius:13px;text-decoration:none;font-size:19px;min-height:66px;
display:inline-flex;align-items:center}
</style></head><body>
<div class="wrap">
<h1>Nanitch has moved</h1>
<p>This page now lives at <strong>nanitch.com</strong>. You should be redirected automatically.</p>
<p><a class="cta" href="https://nanitch.com/">Go to nanitch.com →</a></p>
</div>
</body></html>
